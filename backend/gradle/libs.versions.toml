[versions]
spring = "5.3.39"
mybatis = "3.5.19"
mybatis-spring = "2.1.2"
mysql = "8.4.0"
hikari = "5.1.0"
jackson = "2.18.6"
log4j = "2.26.1"
servlet = "4.0.1"
