db.driver-class-name=com.mysql.cj.jdbc.Driver
db.jdbc-url=${DANJJAK_DB_URL:jdbc:mysql://localhost:3306/danjjak?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
db.username=${DANJJAK_DB_USERNAME:danjjak}
db.password=${DANJJAK_DB_PASSWORD:danjjak_local}
db.maximum-pool-size=${DANJJAK_DB_POOL_SIZE:10}


app.frontend-url=${DANJJAK_FRONTEND_URL:http://localhost:5173}

kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/danjjak/api/auth/kakao/callback}
kakao.authorization-url=${KAKAO_AUTHORIZATION_URL:https://kauth.kakao.com/oauth/authorize}
kakao.token-url=${KAKAO_TOKEN_URL:https://kauth.kakao.com/oauth/token}
kakao.user-info-url=${KAKAO_USER_INFO_URL:https://kapi.kakao.com/v2/user/me}

support.customer-center-phone=${DANJJAK_CUSTOMER_CENTER_PHONE:1588-0000}
kakao.message-url=${KAKAO_MESSAGE_URL:https://kapi.kakao.com/v2/api/talk/memo/default/send}
kakao.message-link-url=${KAKAO_MESSAGE_LINK_URL:https://github.com/team-bestfriend/danjjak}

