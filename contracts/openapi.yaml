openapi: 3.0.3
info:
  title: Danjjak API
  version: 0.2.0
  description: 고령 사용자의 금융 업무 흐름을 지원하는 단짝 서비스 API입니다.
servers:
  - url: http://localhost:8080/danjjak
    description: 로컬 Tomcat
security:
  - sessionCookie: []
tags:
  - name: Health
    description: 애플리케이션 상태 확인
  - name: Accounts
    description: 본인 계좌와 거래내역 조회
  - name: Registered People
    description: 등록 인물과 수취 계좌 관리
  - name: Transfers
    description: Mock 송금 처리
  - name: Support
    description: 보호자 연락처, 고객센터 및 카카오 알림
  - name: TTS
    description: 화면 음성 안내 생성
  - name: Users
    description: 현재 사용자, 동의 및 접근성 설정
  - name: Authentication
    description: 카카오 OAuth와 서버 세션
  - name: Patterns
    description: 금융 패턴과 단축번호 관리
paths:
  /api/auth/kakao/start:
    get:
      tags: [Authentication]
      operationId: startKakaoLogin
      summary: 카카오 OAuth 인가 시작
      description: CSRF 방지 state를 서버 세션에 저장하고 카카오 동의 화면으로 이동한다.
      security: []
      responses:
        '302':
          description: 카카오 인가 화면으로 이동
          headers:
            Location:
              schema:
                type: string
                format: uri
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/kakao/callback:
    get:
      tags: [Authentication]
      operationId: handleKakaoCallback
      summary: 카카오 OAuth 콜백 처리
      description: 인가 코드를 토큰으로 교환하고 카카오 사용자와 시드 사용자를 연결한 뒤 서버 세션을 만든다.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: 성공, 취소 또는 오류 상태를 담아 프론트엔드 콜백 화면으로 이동
          headers:
            Location:
              schema:
                type: string
                format: uri
  /api/auth/session:
    get:
      tags: [Authentication]
      operationId: getSession
      summary: 현재 로그인 세션 조회
      security: []
      responses:
        '200':
          description: 인증 여부와 인증된 경우의 현재 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: 현재 서버 세션 로그아웃
      description: OAuth 토큰을 포함한 현재 HttpSession을 제거한다.
      security: []
      responses:
        '204':
          description: 세션 제거 완료 또는 이미 로그아웃 상태
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 애플리케이션 상태 확인
      security: []
      responses:
        '200':
          description: 애플리케이션이 실행 중임
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/health/db:
    get:
      tags: [Health]
      operationId: getDatabaseHealth
      summary: 데이터베이스 연결 상태 확인
      security: []
      responses:
        '200':
          description: 데이터베이스 상태 확인 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealthResponse'
  /api/accounts:
    get:
      tags: [Accounts]
      operationId: getAccounts
      summary: 본인 계좌 목록 조회
      responses:
        '200':
          description: 기본 출금 계좌가 먼저 정렬된 본인 계좌 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnedAccount'
  /api/accounts/{accountId}/balance:
    get:
      tags: [Accounts]
      operationId: getAccountBalance
      summary: 본인 계좌 잔액 조회
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: 계좌 현재 잔액
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/accounts/{accountId}/transactions:
    get:
      tags: [Accounts]
      operationId: getAccountTransactions
      summary: 본인 계좌 거래내역 조회
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: category
          in: query
          required: false
          description: 거래 카테고리 필터
          schema:
            $ref: '#/components/schemas/TransactionCategory'
      responses:
        '200':
          description: 최신순 거래내역
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/registered-persons:
    get:
      tags: [Registered People]
      operationId: getRegisteredPersons
      summary: 등록 인물과 수취 계좌 목록 조회
      responses:
        '200':
          description: 등록 인물 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegisteredPerson'
    post:
      tags: [Registered People]
      operationId: createRegisteredPerson
      summary: 등록 인물과 수취 계좌 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisteredPersonRequest'
      responses:
        '201':
          description: 생성된 등록 인물
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredPerson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/registered-persons/{registeredPersonId}:
    put:
      tags: [Registered People]
      operationId: updateRegisteredPerson
      summary: 등록 인물과 수취 계좌 수정
      parameters:
        - $ref: '#/components/parameters/RegisteredPersonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisteredPersonRequest'
      responses:
        '200':
          description: 수정된 등록 인물
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredPerson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/transfers:
    post:
      tags: [Transfers]
      operationId: createMockTransfer
      summary: 등록 수취 계좌 또는 직접 입력 계좌로 Mock 송금
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: 정상 송금 완료 또는 이상거래 재확인 필요 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/anomaly-events/{anomalyEventId}/resolve:
    post:
      tags: [Transfers]
      operationId: resolveAnomaly
      summary: 이상거래 재확인 후 계속 송금 또는 취소
      description: 이미 최종 처리된 이상거래는 추가 변경 없이 저장된 최종 결과를 반환한다.
      parameters:
        - $ref: '#/components/parameters/AnomalyEventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveAnomalyRequest'
      responses:
        '200':
          description: 이상거래 최종 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveAnomalyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/support:
    get:
      tags: [Support]
      operationId: getSupport
      summary: 보호자 연락처와 고객센터 전화번호 조회
      responses:
        '200':
          description: 전화 연결에 사용할 지원 연락처
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportResponse'
  /api/tts:
    post:
      tags: [TTS]
      operationId: createSpeech
      summary: 화면 안내 문구 음성 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TtsRequest'
      responses:
        '200':
          description: MP3 형식의 음성 안내
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/TtsProviderError'
  /api/support/guardian:
    put:
      tags: [Support]
      operationId: updateGuardianContact
      summary: 사용자당 보호자 연락처 1개 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardianContactRequest'
      responses:
        '200':
          description: 수정된 보호자 연락처
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianContact'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/anomaly-events/{anomalyEventId}/guardian-notification:
    post:
      tags: [Support]
      operationId: sendGuardianNotification
      summary: 사용자가 선택한 HIGH 이상거래 카카오 알림 전송
      description: 보호자 공유 동의가 있을 때만, 보호자 전화번호가 아니라 로그인한 시연 계정의 카카오 나에게 보내기를 사용한다. 이미 실제 발송에 성공했다면 저장된 SENT 결과를 반환하며 다시 발송하지 않는다.
      parameters:
        - $ref: '#/components/parameters/AnomalyEventId'
      responses:
        '200':
          description: 실제 발송 또는 Mock 대체 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: 현재 사용자와 설정 조회
      responses:
        '200':
          description: 로그인 사용자, 동의 및 접근성 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/users/me/consents:
    put:
      tags: [Users]
      operationId: updateCurrentUserConsents
      summary: 이용 기록과 보호자 공유 동의 저장
      description: 두 항목을 모두 거부해도 동의 절차는 완료할 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentUpdateRequest'
      responses:
        '200':
          description: 저장된 동의 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/users/me/settings:
    put:
      tags: [Users]
      operationId: updateCurrentUserSettings
      summary: 접근성 설정 저장
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessibilitySettings'
      responses:
        '200':
          description: 저장된 접근성 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessibilitySettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/pattern-templates:
    get:
      tags: [Patterns]
      operationId: getPatternTemplates
      summary: 등록 가능한 금융 패턴 템플릿 조회
      description: 구현되지 않은 업무는 available=false로 내려 화면에서 비활성화한다.
      responses:
        '200':
          description: 정해진 금융 업무 템플릿 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatternTemplate'
  /api/patterns:
    get:
      tags: [Patterns]
      operationId: getPatterns
      summary: 활성 금융 패턴과 단축번호 목록 조회
      responses:
        '200':
          description: 단축번호 오름차순으로 정렬된 활성 패턴
          content:
            application/json:
              schema:
                type: array
                maxItems: 12
                items:
                  $ref: '#/components/schemas/PatternSummary'
    post:
      tags: [Patterns]
      operationId: createPattern
      summary: 정해진 템플릿으로 금융 패턴 등록
      description: 패턴과 템플릿 단계 사본을 하나의 트랜잭션으로 생성한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatternCreateRequest'
      responses:
        '201':
          description: 생성된 금융 패턴
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatternDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/patterns/order:
    put:
      tags: [Patterns]
      operationId: updatePatternOrder
      summary: 단축번호 배치 저장
      description: 현재 사용자의 활성 패턴 전체를 중복 없는 1~12번에 배치한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatternOrderRequest'
      responses:
        '200':
          description: 변경된 단축번호 순서의 활성 패턴
          content:
            application/json:
              schema:
                type: array
                maxItems: 12
                items:
                  $ref: '#/components/schemas/PatternSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/patterns/{patternId}:
    parameters:
      - $ref: '#/components/parameters/PatternId'
    get:
      tags: [Patterns]
      operationId: getPattern
      summary: 금융 패턴과 단계 상세 조회
      responses:
        '200':
          description: 실행 화면에서 사용할 패턴과 단계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatternDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Patterns]
      operationId: updatePattern
      summary: 금융 패턴 이름, 설명 또는 연결 계좌 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatternUpdateRequest'
      responses:
        '200':
          description: 수정된 금융 패턴
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatternDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Patterns]
      operationId: deletePattern
      summary: 금융 패턴과 단축번호 비활성화
      description: 실행 기록을 보존하기 위해 행을 삭제하지 않고 비활성화한다.
      responses:
        '204':
          description: 비활성화 완료
        '404':
          $ref: '#/components/responses/NotFound'
  /api/patterns/{patternId}/executions:
    parameters:
      - $ref: '#/components/parameters/PatternId'
    post:
      tags: [Patterns]
      operationId: startPatternExecution
      summary: 확인된 금융 패턴 실행 시작
      description: 이용 기록 동의가 없으면 패턴 상세만 반환하고 실행 행은 만들지 않는다.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionStartRequest'
      responses:
        '201':
          description: 실행 시작 결과와 실행에 사용할 최신 패턴 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/pattern-executions/{executionId}/visits:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [Patterns]
      operationId: startPatternStepVisit
      summary: 패턴 실행의 단계 방문 시작
      description: 같은 단계에 재진입하면 다음 visitNumber의 새 방문을 만든다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitStartRequest'
      responses:
        '201':
          description: 생성된 단계 방문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepVisit'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/pattern-executions/{executionId}/visits/{visitId}:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
      - $ref: '#/components/parameters/VisitId'
    patch:
      tags: [Patterns]
      operationId: updatePatternStepVisit
      summary: 단계 방문 행동 집계와 종료 저장
      description: 원시 클릭 대신 현재 방문의 누적 행동 수와 경로 이탈 여부만 저장한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitUpdateRequest'
      responses:
        '200':
          description: 갱신된 단계 방문과 시각에서 계산한 소요시간
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepVisit'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/pattern-executions/{executionId}:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    patch:
      tags: [Patterns]
      operationId: finishPatternExecution
      summary: 패턴 실행 최종 상태 저장
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionFinishRequest'
      responses:
        '200':
          description: 종료된 패턴 실행
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionFinishResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: DANJJAKSESSION
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RegisteredPersonId:
      name: registeredPersonId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AnomalyEventId:
      name: anomalyEventId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PatternId:
      name: patternId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    VisitId:
      name: visitId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 현재 데이터 상태와 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 로그인 세션이 없거나 만료됨
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 필요한 선택 동의가 없어 요청이 허용되지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: 외부 연동을 위한 로컬 설정이 준비되지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: 요청은 유효하지만 처리할 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TtsProviderError:
      description: 외부 TTS 공급자 호출 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
    DatabaseHealthResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          example: UP
        database:
          type: string
          enum: [UP, DOWN]
          example: UP
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: 요청한 리소스를 찾을 수 없습니다.
    TtsRequest:
      type: object
      required: [text, speed]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          example: 누구에게 보내실지 선택해 주세요.
        speed:
          type: string
          enum: [SLOW, NORMAL, FAST]
          example: NORMAL
    OwnedAccount:
      type: object
      required:
        [accountId, bankCode, bankName, accountNumber, balance, primary]
      properties:
        accountId:
          type: integer
          format: int64
        bankCode:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        accountAlias:
          type: string
          nullable: true
        balance:
          type: integer
          format: int64
          minimum: 0
        primary:
          type: boolean
    BalanceResponse:
      type: object
      required: [accountId, balance]
      properties:
        accountId:
          type: integer
          format: int64
        balance:
          type: integer
          format: int64
          minimum: 0
    RecipientAccount:
      type: object
      required: [accountId, bankCode, bankName, accountNumber]
      properties:
        accountId:
          type: integer
          format: int64
        bankCode:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        accountAlias:
          type: string
          nullable: true
    RegisteredPerson:
      type: object
      required: [registeredPersonId, name, relationship, account]
      properties:
        registeredPersonId:
          type: integer
          format: int64
        name:
          type: string
        relationship:
          type: string
        account:
          $ref: '#/components/schemas/RecipientAccount'
    RegisteredPersonRequest:
      type: object
      required: [name, relationship, bankCode, bankName, accountNumber]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        relationship:
          type: string
          minLength: 1
          maxLength: 30
        bankCode:
          type: string
          minLength: 1
          maxLength: 20
        bankName:
          type: string
          minLength: 1
          maxLength: 50
        accountNumber:
          type: string
          minLength: 8
          maxLength: 50
          pattern: '^[0-9-]+$'
        accountAlias:
          type: string
          maxLength: 50
          nullable: true
    TransactionCategory:
      type: string
      enum:
        [GENERAL, TRANSFER, PENSION, MANAGEMENT_FEE, UTILITY_BILL, AUTO_TRANSFER, CARD]
    Transaction:
      type: object
      required:
        [transactionId, transactionType, category, amount, description, balanceAfter, transactionAt]
      properties:
        transactionId:
          type: integer
          format: int64
        transactionType:
          type: string
          enum: [DEPOSIT, WITHDRAWAL, TRANSFER_OUT, PAYMENT]
        category:
          $ref: '#/components/schemas/TransactionCategory'
        amount:
          type: integer
          format: int64
          minimum: 1
        counterpartyName:
          type: string
          nullable: true
        description:
          type: string
        balanceAfter:
          type: integer
          format: int64
          minimum: 0
        transactionAt:
          type: string
          format: date-time
    DirectRecipientRequest:
      type: object
      required: [name, bankCode, bankName, accountNumber]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        bankCode:
          type: string
          minLength: 1
          maxLength: 20
        bankName:
          type: string
          minLength: 1
          maxLength: 50
        accountNumber:
          type: string
          minLength: 8
          maxLength: 50
          pattern: '^[0-9-]+$'
    TransferRequest:
      type: object
      required: [sourceAccountId, amount, pin]
      oneOf:
        - required: [registeredRecipientAccountId]
        - required: [directRecipient]
      properties:
        sourceAccountId:
          type: integer
          format: int64
          minimum: 1
        registeredRecipientAccountId:
          type: integer
          format: int64
          minimum: 1
        directRecipient:
          $ref: '#/components/schemas/DirectRecipientRequest'
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 999999999999999
        patternExecutionId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        pin:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 30
    TransferResponse:
      type: object
      required: [status, riskLevel, reasons, recentTransferCount, balanceAfter]
      properties:
        status:
          type: string
          enum: [COMPLETED, REQUIRES_REVIEW]
        riskLevel:
          type: string
          enum: [NORMAL, MEDIUM, HIGH]
        reasons:
          type: array
          items:
            type: string
            enum: [HIGH_AMOUNT, REPEATED_TRANSFER]
        recentTransferCount:
          type: integer
          minimum: 0
        anomalyEventId:
          type: integer
          format: int64
          nullable: true
        transactionId:
          type: integer
          format: int64
          nullable: true
        balanceAfter:
          type: integer
          format: int64
          minimum: 0
    ResolveAnomalyRequest:
      type: object
      required: [action, rechecked]
      properties:
        action:
          type: string
          enum: [CONTINUE, CANCEL]
        rechecked:
          type: boolean
    ResolveAnomalyResponse:
      type: object
      required: [anomalyEventId, action]
      properties:
        anomalyEventId:
          type: integer
          format: int64
        action:
          type: string
          enum: [CONTINUE, CANCEL]
        transactionId:
          type: integer
          format: int64
          nullable: true
        balanceAfter:
          type: integer
          format: int64
          minimum: 0
          nullable: true
    GuardianContact:
      type: object
      required: [guardianContactId, phoneNumber]
      properties:
        guardianContactId:
          type: integer
          format: int64
        phoneNumber:
          type: string
          pattern: '^[0-9-]{8,20}$'
    GuardianContactRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber:
          type: string
          pattern: '^[0-9-]{8,20}$'
    SupportResponse:
      type: object
      required: [guardian, customerCenterPhone]
      properties:
        guardian:
          type: object
          allOf:
            - $ref: '#/components/schemas/GuardianContact'
          nullable: true
        customerCenterPhone:
          type: string
    NotificationResponse:
      type: object
      required:
        [anomalyEventId, deliveryMode, result, actualAttempted, actualSucceeded, detail]
      properties:
        anomalyEventId:
          type: integer
          format: int64
        deliveryMode:
          type: string
          enum: [ACTUAL, MOCK]
        result:
          type: string
          enum: [SENT, MOCKED_NO_TOKEN, MOCKED_AFTER_ACTUAL_FAILURE]
        actualAttempted:
          type: boolean
        actualSucceeded:
          type: boolean
        detail:
          type: string
        sentAt:
          type: string
          format: date-time
          nullable: true
          description: 실제 카카오 발송 성공 시 서버가 기록한 발송 시각
    CurrentUserResponse:
      type: object
      required: [userId, name, consents, settings]
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          maxLength: 50
        consents:
          $ref: '#/components/schemas/ConsentSettings'
        settings:
          $ref: '#/components/schemas/AccessibilitySettings'
    SessionResponse:
      type: object
      required: [authenticated, user]
      properties:
        authenticated:
          type: boolean
        user:
          type: object
          allOf:
            - $ref: '#/components/schemas/CurrentUserResponse'
          nullable: true
    ConsentSettings:
      type: object
      required: [completed, usageLogAgreed, guardianShareAgreed]
      properties:
        completed:
          type: boolean
          description: 두 동의를 모두 거부하더라도 선택을 마치면 true
        usageLogAgreed:
          type: boolean
        guardianShareAgreed:
          type: boolean
    ConsentUpdateRequest:
      type: object
      required: [usageLogAgreed, guardianShareAgreed]
      additionalProperties: false
      properties:
        usageLogAgreed:
          type: boolean
        guardianShareAgreed:
          type: boolean
    AccessibilitySettings:
      type: object
      required: [fontSize, voiceSpeed, guideVoiceType]
      additionalProperties: false
      properties:
        fontSize:
          type: string
          enum: [SMALL, NORMAL, LARGE]
        voiceSpeed:
          type: string
          enum: [SLOW, NORMAL, FAST]
        guideVoiceType:
          type: string
          enum: [TTS, FAMILY]
    PatternType:
      type: string
      enum:
        - TRANSFER
        - PENSION_CHECK
        - MANAGEMENT_FEE_CHECK
        - BALANCE_CHECK
        - TRANSACTION_HISTORY
        - CUSTOMER_CENTER
        - UTILITY_BILL_CHECK
        - AUTO_TRANSFER_CHECK
        - CARD_HISTORY
        - DEPOSIT_MATURITY_CHECK
    PatternTemplate:
      type: object
      required: [patternType, defaultTitle, defaultDescription, requiresLinkedAccount, available, steps]
      properties:
        patternType:
          $ref: '#/components/schemas/PatternType'
        defaultTitle:
          type: string
        defaultDescription:
          type: string
        requiresLinkedAccount:
          type: boolean
        available:
          type: boolean
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PatternTemplateStep'
    PatternTemplateStep:
      type: object
      required: [stepOrder, stepCode, stepName, instructionText, screenCode]
      properties:
        stepOrder:
          type: integer
          minimum: 1
        stepCode:
          type: string
          maxLength: 50
        stepName:
          type: string
          maxLength: 100
        instructionText:
          type: string
          maxLength: 500
        screenCode:
          type: string
          maxLength: 100
        targetElementId:
          type: string
          maxLength: 100
          nullable: true
    PatternLinkedAccount:
      type: object
      required: [accountId, bankCode, bankName, accountNumber]
      properties:
        accountId:
          type: integer
          format: int64
          minimum: 1
        bankCode:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        accountAlias:
          type: string
          nullable: true
        registeredPersonId:
          type: integer
          format: int64
          nullable: true
        registeredPersonName:
          type: string
          nullable: true
        relationship:
          type: string
          nullable: true
    PatternSummary:
      type: object
      required: [patternId, shortcutNumber, patternType, title, description, linkedAccount]
      properties:
        patternId:
          type: integer
          format: int64
          minimum: 1
        shortcutNumber:
          type: integer
          minimum: 1
          maximum: 12
        patternType:
          $ref: '#/components/schemas/PatternType'
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        linkedAccount:
          type: object
          allOf:
            - $ref: '#/components/schemas/PatternLinkedAccount'
          nullable: true
    PatternStep:
      type: object
      required: [stepId, stepOrder, stepCode, stepName, instructionText, screenCode]
      properties:
        stepId:
          type: integer
          format: int64
          minimum: 1
        stepOrder:
          type: integer
          minimum: 1
        stepCode:
          type: string
          maxLength: 50
        stepName:
          type: string
          maxLength: 100
        instructionText:
          type: string
          maxLength: 500
        screenCode:
          type: string
          maxLength: 100
        targetElementId:
          type: string
          maxLength: 100
          nullable: true
        voiceFilePath:
          type: string
          maxLength: 500
          nullable: true
        voiceContentType:
          type: string
          maxLength: 100
          nullable: true
    PatternDetail:
      allOf:
        - $ref: '#/components/schemas/PatternSummary'
        - type: object
          required: [steps]
          properties:
            steps:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/PatternStep'
    PatternCreateRequest:
      type: object
      required: [patternType, shortcutNumber]
      additionalProperties: false
      properties:
        patternType:
          $ref: '#/components/schemas/PatternType'
        shortcutNumber:
          type: integer
          minimum: 1
          maximum: 12
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 500
        linkedBankAccountId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        stepInstructions:
          type: array
          items:
            $ref: '#/components/schemas/StepInstructionRequest'
    PatternUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 500
        linkedBankAccountId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        stepInstructions:
          type: array
          items:
            $ref: '#/components/schemas/StepInstructionRequest'
    StepInstructionRequest:
      type: object
      required: [stepCode, instructionText]
      additionalProperties: false
      properties:
        stepCode:
          type: string
          minLength: 1
          maxLength: 50
        instructionText:
          type: string
          minLength: 1
          maxLength: 500
    PatternOrderRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/PatternOrderItem'
    PatternOrderItem:
      type: object
      required: [patternId, shortcutNumber]
      additionalProperties: false
      properties:
        patternId:
          type: integer
          format: int64
          minimum: 1
        shortcutNumber:
          type: integer
          minimum: 1
          maximum: 12
    ExecutionStartRequest:
      type: object
      additionalProperties: false
      properties:
        sourceBankAccountId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
    ExecutionStartResponse:
      type: object
      required: [loggingEnabled, executionId, startedAt, pattern]
      properties:
        loggingEnabled:
          type: boolean
        executionId:
          type: integer
          format: int64
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        pattern:
          $ref: '#/components/schemas/PatternDetail'
    VisitStartRequest:
      type: object
      required: [stepId]
      additionalProperties: false
      properties:
        stepId:
          type: integer
          format: int64
          minimum: 1
    VisitUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        retryCount:
          type: integer
          minimum: 0
        backCount:
          type: integer
          minimum: 0
        wrongTouchCount:
          type: integer
          minimum: 0
        routeDeviation:
          type: boolean
        completed:
          type: boolean
    StepVisit:
      type: object
      required:
        [visitId, executionId, stepId, visitNumber, retryCount, backCount,
         wrongTouchCount, routeDeviation, completed, startedAt, endedAt, durationSeconds]
      properties:
        visitId:
          type: integer
          format: int64
        executionId:
          type: integer
          format: int64
        stepId:
          type: integer
          format: int64
        visitNumber:
          type: integer
          minimum: 1
        retryCount:
          type: integer
          minimum: 0
        backCount:
          type: integer
          minimum: 0
        wrongTouchCount:
          type: integer
          minimum: 0
        routeDeviation:
          type: boolean
        completed:
          type: boolean
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
          nullable: true
    ExecutionFinishRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [COMPLETED, CANCELLED, FAILED]
    ExecutionFinishResponse:
      type: object
      required: [executionId, status, endedAt]
      properties:
        executionId:
          type: integer
          format: int64
        status:
          type: string
          enum: [COMPLETED, CANCELLED, FAILED]
        endedAt:
          type: string
          format: date-time
