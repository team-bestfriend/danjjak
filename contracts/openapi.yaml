openapi: 3.0.3
info:
  title: Danjjak API
  version: 0.1.0
  description: 고령 사용자의 금융 업무 흐름을 지원하는 단짝 서비스 API입니다.
servers:
  - url: http://localhost:8080/danjjak
    description: 로컬 Tomcat
security: []
tags:
  - name: Health
    description: 애플리케이션 상태 확인
  - name: Accounts
    description: 본인 계좌와 거래내역 조회
  - name: Registered People
    description: 등록 인물과 수취 계좌 관리
  - name: Transfers
    description: Mock 송금 처리
  - name: Support
    description: 보호자 연락처, 고객센터 및 카카오 알림
  - name: TTS
    description: 화면 음성 안내 생성
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 애플리케이션 상태 확인
      security: []
      responses:
        '200':
          description: 애플리케이션이 실행 중임
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/health/db:
    get:
      tags: [Health]
      operationId: getDatabaseHealth
      summary: 데이터베이스 연결 상태 확인
      security: []
      responses:
        '200':
          description: 데이터베이스 상태 확인 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealthResponse'
  /api/accounts:
    get:
      tags: [Accounts]
      operationId: getAccounts
      summary: 본인 계좌 목록 조회
      responses:
        '200':
          description: 기본 출금 계좌가 먼저 정렬된 본인 계좌 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnedAccount'
  /api/accounts/{accountId}/balance:
    get:
      tags: [Accounts]
      operationId: getAccountBalance
      summary: 본인 계좌 잔액 조회
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: 계좌 현재 잔액
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/accounts/{accountId}/transactions:
    get:
      tags: [Accounts]
      operationId: getAccountTransactions
      summary: 본인 계좌 거래내역 조회
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: category
          in: query
          required: false
          description: 거래 카테고리 필터
          schema:
            $ref: '#/components/schemas/TransactionCategory'
      responses:
        '200':
          description: 최신순 거래내역
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/registered-persons:
    get:
      tags: [Registered People]
      operationId: getRegisteredPersons
      summary: 등록 인물과 수취 계좌 목록 조회
      responses:
        '200':
          description: 등록 인물 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegisteredPerson'
    post:
      tags: [Registered People]
      operationId: createRegisteredPerson
      summary: 등록 인물과 수취 계좌 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisteredPersonRequest'
      responses:
        '201':
          description: 생성된 등록 인물
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredPerson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/registered-persons/{registeredPersonId}:
    put:
      tags: [Registered People]
      operationId: updateRegisteredPerson
      summary: 등록 인물과 수취 계좌 수정
      parameters:
        - $ref: '#/components/parameters/RegisteredPersonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisteredPersonRequest'
      responses:
        '200':
          description: 수정된 등록 인물
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredPerson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/transfers:
    post:
      tags: [Transfers]
      operationId: createMockTransfer
      summary: 등록 수취 계좌 또는 직접 입력 계좌로 Mock 송금
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: 정상 송금 완료 또는 이상거래 재확인 필요 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/anomaly-events/{anomalyEventId}/resolve:
    post:
      tags: [Transfers]
      operationId: resolveAnomaly
      summary: 이상거래 재확인 후 계속 송금 또는 취소
      parameters:
        - $ref: '#/components/parameters/AnomalyEventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveAnomalyRequest'
      responses:
        '200':
          description: 이상거래 최종 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveAnomalyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/support:
    get:
      tags: [Support]
      operationId: getSupport
      summary: 보호자 연락처와 고객센터 전화번호 조회
      responses:
        '200':
          description: 전화 연결에 사용할 지원 연락처
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportResponse'
  /api/tts:
    post:
      tags: [TTS]
      operationId: createSpeech
      summary: 화면 안내 문구 음성 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TtsRequest'
      responses:
        '200':
          description: MP3 형식의 음성 안내
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/TtsProviderError'
  /api/support/guardian:
    put:
      tags: [Support]
      operationId: updateGuardianContact
      summary: 사용자당 보호자 연락처 1개 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardianContactRequest'
      responses:
        '200':
          description: 수정된 보호자 연락처
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianContact'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/anomaly-events/{anomalyEventId}/guardian-notification:
    post:
      tags: [Support]
      operationId: sendGuardianNotification
      summary: 사용자가 선택한 HIGH 이상거래 카카오 알림 전송
      description: 보호자 전화번호가 아니라 로그인한 시연 계정의 카카오 나에게 보내기를 사용한다.
      parameters:
        - $ref: '#/components/parameters/AnomalyEventId'
      responses:
        '200':
          description: 실제 발송 또는 Mock 대체 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RegisteredPersonId:
      name: registeredPersonId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AnomalyEventId:
      name: anomalyEventId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 현재 데이터 상태와 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: 요청은 유효하지만 처리할 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TtsProviderError:
      description: 외부 TTS 공급자 호출 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
    DatabaseHealthResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          example: UP
        database:
          type: string
          enum: [UP, DOWN]
          example: UP
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: 요청한 리소스를 찾을 수 없습니다.
    TtsRequest:
      type: object
      required: [text, speed]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          example: 누구에게 보내실지 선택해 주세요.
        speed:
          type: string
          enum: [SLOW, NORMAL, FAST]
          example: NORMAL
    OwnedAccount:
      type: object
      required:
        [accountId, bankCode, bankName, accountNumber, balance, primary]
      properties:
        accountId:
          type: integer
          format: int64
        bankCode:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        accountAlias:
          type: string
          nullable: true
        balance:
          type: integer
          format: int64
          minimum: 0
        primary:
          type: boolean
    BalanceResponse:
      type: object
      required: [accountId, balance]
      properties:
        accountId:
          type: integer
          format: int64
        balance:
          type: integer
          format: int64
          minimum: 0
    RecipientAccount:
      type: object
      required: [accountId, bankCode, bankName, accountNumber]
      properties:
        accountId:
          type: integer
          format: int64
        bankCode:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        accountAlias:
          type: string
          nullable: true
    RegisteredPerson:
      type: object
      required: [registeredPersonId, name, relationship, account]
      properties:
        registeredPersonId:
          type: integer
          format: int64
        name:
          type: string
        relationship:
          type: string
        account:
          $ref: '#/components/schemas/RecipientAccount'
    RegisteredPersonRequest:
      type: object
      required: [name, relationship, bankCode, bankName, accountNumber]
      properties:
        name:
          type: string
          maxLength: 50
        relationship:
          type: string
          maxLength: 30
        bankCode:
          type: string
          maxLength: 20
        bankName:
          type: string
          maxLength: 50
        accountNumber:
          type: string
          maxLength: 50
        accountAlias:
          type: string
          maxLength: 50
          nullable: true
    TransactionCategory:
      type: string
      enum:
        [GENERAL, TRANSFER, PENSION, MANAGEMENT_FEE, UTILITY_BILL, AUTO_TRANSFER, CARD]
    Transaction:
      type: object
      required:
        [transactionId, transactionType, category, amount, description, balanceAfter, transactionAt]
      properties:
        transactionId:
          type: integer
          format: int64
        transactionType:
          type: string
          enum: [DEPOSIT, WITHDRAWAL, TRANSFER_OUT, PAYMENT]
        category:
          $ref: '#/components/schemas/TransactionCategory'
        amount:
          type: integer
          format: int64
          minimum: 1
        counterpartyName:
          type: string
          nullable: true
        description:
          type: string
        balanceAfter:
          type: integer
          format: int64
          minimum: 0
        transactionAt:
          type: string
          format: date-time
    DirectRecipientRequest:
      type: object
      required: [name, bankCode, bankName, accountNumber]
      properties:
        name:
          type: string
          maxLength: 100
        bankCode:
          type: string
          maxLength: 20
        bankName:
          type: string
          maxLength: 50
        accountNumber:
          type: string
          maxLength: 50
    TransferRequest:
      type: object
      required: [sourceAccountId, amount, pin]
      oneOf:
        - required: [registeredRecipientAccountId]
        - required: [directRecipient]
      properties:
        sourceAccountId:
          type: integer
          format: int64
          minimum: 1
        registeredRecipientAccountId:
          type: integer
          format: int64
          minimum: 1
        directRecipient:
          $ref: '#/components/schemas/DirectRecipientRequest'
        amount:
          type: integer
          format: int64
          minimum: 1
        patternExecutionId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        pin:
          type: string
          writeOnly: true
          maxLength: 30
    TransferResponse:
      type: object
      required: [status, riskLevel, reasons, recentTransferCount, balanceAfter]
      properties:
        status:
          type: string
          enum: [COMPLETED, REQUIRES_REVIEW]
        riskLevel:
          type: string
          enum: [NORMAL, MEDIUM, HIGH]
        reasons:
          type: array
          items:
            type: string
            enum: [HIGH_AMOUNT, REPEATED_TRANSFER]
        recentTransferCount:
          type: integer
          minimum: 0
        anomalyEventId:
          type: integer
          format: int64
          nullable: true
        transactionId:
          type: integer
          format: int64
          nullable: true
        balanceAfter:
          type: integer
          format: int64
          minimum: 0
    ResolveAnomalyRequest:
      type: object
      required: [action, rechecked]
      properties:
        action:
          type: string
          enum: [CONTINUE, CANCEL]
        rechecked:
          type: boolean
    ResolveAnomalyResponse:
      type: object
      required: [anomalyEventId, action]
      properties:
        anomalyEventId:
          type: integer
          format: int64
        action:
          type: string
          enum: [CONTINUE, CANCEL]
        transactionId:
          type: integer
          format: int64
          nullable: true
        balanceAfter:
          type: integer
          format: int64
          minimum: 0
          nullable: true
    GuardianContact:
      type: object
      required: [guardianContactId, phoneNumber]
      properties:
        guardianContactId:
          type: integer
          format: int64
        phoneNumber:
          type: string
          pattern: '^[0-9-]{8,20}$'
    GuardianContactRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber:
          type: string
          pattern: '^[0-9-]{8,20}$'
    SupportResponse:
      type: object
      required: [guardian, customerCenterPhone]
      properties:
        guardian:
          type: object
          allOf:
            - $ref: '#/components/schemas/GuardianContact'
          nullable: true
        customerCenterPhone:
          type: string
    NotificationResponse:
      type: object
      required:
        [anomalyEventId, deliveryMode, result, actualAttempted, actualSucceeded, detail]
      properties:
        anomalyEventId:
          type: integer
          format: int64
        deliveryMode:
          type: string
          enum: [ACTUAL, MOCK]
        result:
          type: string
          enum: [SENT, MOCKED_NO_TOKEN, MOCKED_AFTER_ACTUAL_FAILURE]
        actualAttempted:
          type: boolean
        actualSucceeded:
          type: boolean
        detail:
          type: string
