      summary: 확인된 금융 패턴 실행 시작
      description: 명시적으로 실행을 시작할 때만 호출한다. 확인 화면 조회에서는 호출하지 않는다. 이용 기록 동의가 없으면 loggingEnabled=false, executionId와 startedAt은 null이며 패턴 상세만 반환하고 실행 행은 만들지 않는다.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionStartRequest'
      responses:
