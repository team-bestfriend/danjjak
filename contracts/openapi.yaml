openapi: 3.0.3
info:
  title: Danjjak API
  version: 0.1.0
  description: 고령 사용자의 금융 업무 흐름을 지원하는 단짝 서비스 API입니다.
servers:
  - url: http://localhost:8080/danjjak
    description: 로컬 Tomcat
tags:
  - name: Health
    description: 애플리케이션 상태 확인
  - name: Accounts
    description: 본인 계좌와 거래내역 조회
  - name: Registered People
    description: 등록 인물과 수취 계좌 관리
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 애플리케이션 상태 확인
      security: []
      responses:
        '200':
          description: 애플리케이션이 실행 중임
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/health/db:
    get:
      tags: [Health]
      operationId: getDatabaseHealth
      summary: 데이터베이스 연결 상태 확인
      security: []
      responses:
        '200':
          description: 데이터베이스 상태 확인 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealthResponse'
  /api/accounts:
    get:
      tags: [Accounts]
      operationId: getAccounts
      summary: 본인 계좌 목록 조회
      responses:
        '200':
          description: 기본 출금 계좌가 먼저 정렬된 본인 계좌 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnedAccount'
  /api/accounts/{accountId}/balance:
    get:
      tags: [Accounts]
      operationId: getAccountBalance
      summary: 본인 계좌 잔액 조회
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: 계좌 현재 잔액
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/accounts/{accountId}/transactions:
    get:
      tags: [Accounts]
      operationId: getAccountTransactions
      summary: 본인 계좌 거래내역 조회
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: category
          in: query
          required: false
          description: 거래 카테고리 필터
          schema:
            $ref: '#/components/schemas/TransactionCategory'
      responses:
        '200':
          description: 최신순 거래내역
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/registered-persons:
    get:
      tags: [Registered People]
      operationId: getRegisteredPersons
      summary: 등록 인물과 수취 계좌 목록 조회
      responses:
        '200':
          description: 등록 인물 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegisteredPerson'
    post:
      tags: [Registered People]
      operationId: createRegisteredPerson
      summary: 등록 인물과 수취 계좌 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisteredPersonRequest'
      responses:
        '201':
          description: 생성된 등록 인물
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredPerson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/registered-persons/{registeredPersonId}:
    put:
      tags: [Registered People]
      operationId: updateRegisteredPerson
      summary: 등록 인물과 수취 계좌 수정
      parameters:
        - $ref: '#/components/parameters/RegisteredPersonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisteredPersonRequest'
      responses:
        '200':
          description: 수정된 등록 인물
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredPerson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RegisteredPersonId:
      name: registeredPersonId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 현재 데이터 상태와 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: 요청은 유효하지만 처리할 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
    DatabaseHealthResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          example: UP
        database:
          type: string
          enum: [UP, DOWN]
          example: UP
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: 요청한 리소스를 찾을 수 없습니다.
    OwnedAccount:
      type: object
      required:
        [accountId, bankCode, bankName, accountNumber, balance, primary]
      properties:
        accountId:
          type: integer
          format: int64
        bankCode:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        accountAlias:
          type: string
          nullable: true
        balance:
          type: integer
          format: int64
          minimum: 0
        primary:
          type: boolean
    BalanceResponse:
      type: object
      required: [accountId, balance]
      properties:
        accountId:
          type: integer
          format: int64
        balance:
          type: integer
          format: int64
          minimum: 0
    RecipientAccount:
      type: object
      required: [accountId, bankCode, bankName, accountNumber]
      properties:
        accountId:
          type: integer
          format: int64
        bankCode:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        accountAlias:
          type: string
          nullable: true
    RegisteredPerson:
      type: object
      required: [registeredPersonId, name, relationship, account]
      properties:
        registeredPersonId:
          type: integer
          format: int64
        name:
          type: string
        relationship:
          type: string
        account:
          $ref: '#/components/schemas/RecipientAccount'
    RegisteredPersonRequest:
      type: object
      required: [name, relationship, bankCode, bankName, accountNumber]
      properties:
        name:
          type: string
          maxLength: 50
        relationship:
          type: string
          maxLength: 30
        bankCode:
          type: string
          maxLength: 20
        bankName:
          type: string
          maxLength: 50
        accountNumber:
          type: string
          maxLength: 50
        accountAlias:
          type: string
          maxLength: 50
          nullable: true
    TransactionCategory:
      type: string
      enum:
        [GENERAL, TRANSFER, PENSION, MANAGEMENT_FEE, UTILITY_BILL, AUTO_TRANSFER, CARD]
    Transaction:
      type: object
      required:
        [transactionId, transactionType, category, amount, description, balanceAfter, transactionAt]
      properties:
        transactionId:
          type: integer
          format: int64
        transactionType:
          type: string
          enum: [DEPOSIT, WITHDRAWAL, TRANSFER_OUT, PAYMENT]
        category:
          $ref: '#/components/schemas/TransactionCategory'
        amount:
          type: integer
          format: int64
          minimum: 1
        counterpartyName:
          type: string
          nullable: true
        description:
          type: string
        balanceAfter:
          type: integer
          format: int64
          minimum: 0
        transactionAt:
          type: string
          format: date-time
