openapi: 3.0.3
info:
  title: Danjjak API
  version: 0.1.0
  description: 고령 사용자의 금융 업무 흐름을 지원하는 단짝 서비스 API입니다.
servers:
  - url: http://localhost:8080/danjjak
    description: 로컬 Tomcat
tags:
  - name: Health
    description: 애플리케이션 상태 확인
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 애플리케이션 상태 확인
      security: []
      responses:
        '200':
          description: 애플리케이션이 실행 중임
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/health/db:
    get:
      tags: [Health]
      operationId: getDatabaseHealth
      summary: 데이터베이스 연결 상태 확인
      security: []
      responses:
        '200':
          description: 데이터베이스 상태 확인 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealthResponse'
components:
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 현재 데이터 상태와 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: 요청은 유효하지만 처리할 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
    DatabaseHealthResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          example: UP
        database:
          type: string
          enum: [UP, DOWN]
          example: UP
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: 요청한 리소스를 찾을 수 없습니다.
