openapi: 3.0.3
info:
  title: Danjjak API
  version: 0.2.0
  description: 고령 사용자의 금융 업무 흐름을 지원하는 단짝 서비스 API입니다.
servers:
  - url: http://localhost:8080/danjjak
    description: 로컬 Tomcat
security:
  - sessionCookie: []
tags:
  - name: Chat
    description: 단짝 업무 찾기 도우미
  - name: Health
    description: 애플리케이션 상태 확인
  - name: Accounts
    description: 본인 계좌와 거래내역 조회
  - name: Registered People
    description: 등록 인물과 수취 계좌 관리
  - name: Transfers
    description: Mock 송금 처리
  - name: Support
    description: 보호자 연락처, 고객센터 및 카카오 알림
  - name: TTS
    description: 화면 음성 안내 생성
  - name: Users
    description: 현재 사용자, 동의 및 접근성 설정
  - name: Authentication
    description: 카카오 OAuth와 서버 세션
  - name: Patterns
    description: 금융 패턴과 단축번호 관리
  - name: Usage Analysis
    description: 이용 기록 기반 수행 횟수와 단계별 행동 분석
paths:
  /api/chat/messages:
    post:
      tags: [Chat]
      operationId: sendChatMessage
      summary: 자연어로 원하는 단짝 업무 찾기
      description: 대화 기록을 저장하지 않는다. AI는 짧은 안내와 업무를 분류하며 금융 업무를 실행하지 않는다. 1~12 단축번호 명령은 현재 사용자의 활성 패턴을 찾아 patternId를 반환한다. 송금 대상은 기존 화면에서 선택한다. 조회 patternId는 현재 사용자의 활성 패턴에서 선택하며 없으면 null이다. AI 오류는 200 응답의 NONE과 retryable로 안내한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: 업무 안내 또는 재시도 가능한 안내
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/usage-analysis/instruction-suggestion:
    get:
      tags: [Usage Analysis]
      operationId: getInstructionSuggestion
      summary: 같은 기간의 어려운 단계에 대한 문구 제안 조회
      description: 동의와 분석 상태를 보존한다. 어려운 단계가 없으면 suggestion은 null이며 저장 문구나 실행 로그를 변경하지 않는다.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: 현재 문구와 단계 코드 기반 제안
          content:
            application/json:
              schema:
                type: object
                required: [status, from, to, suggestion]
                properties:
                  status:
                    type: string
                    enum: [CONSENT_REQUIRED, CONSENT_DECLINED, NO_DATA, AVAILABLE]
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  suggestion:
                    type: object
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/InstructionSuggestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/patterns/{patternId}/steps/{stepId}/instruction-suggestion:
    parameters:
      - $ref: '#/components/parameters/PatternId'
      - name: stepId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [Usage Analysis]
      operationId: applyInstructionSuggestion
      summary: 선택한 단계에 제안 문구 명시적으로 적용
      description: 사용자가 비교한 제안 문구를 같은 instructionText에 저장한다. 음성 선택과 파일을 보존하며 기존 녹음과의 불일치를 표시한다. 비교한 현재 문구가 달라졌으면 409를 반환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedText, suggestedText]
              properties:
                expectedText: { type: string, minLength: 1, maxLength: 500 }
                suggestedText: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: 적용 후 해당 단계의 안내 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guidance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 비교한 문구가 변경됨. 다시 조회한 뒤 비교하고 적용해야 한다.
  /api/patterns/{patternId}/guidance:
    parameters:
      - $ref: '#/components/parameters/PatternId'
    get:
      tags: [Patterns]
      operationId: getPatternGuidance
      summary: 시작 안내와 단계별 음성 설정 조회
      description: target은 시작 안내의 start 또는 서버 템플릿의 stepCode이다. 미리듣기와 편집은 실행 로그를 만들지 않는다.
      responses:
        '200':
          description: 저장된 안내 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Guidance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/patterns/{patternId}/guidance/{target}:
    parameters:
      - $ref: '#/components/parameters/PatternId'
      - $ref: '#/components/parameters/GuidanceTarget'
    put:
      tags: [Patterns]
      operationId: updatePatternGuidance
      summary: 대상 안내 문구와 음성 선택 저장
      description: null 음성 선택은 사용자 기본 설정을 따른다. 문구가 바뀌어도 녹음은 보존되며 voiceScriptOutdated가 true가 된다. 음성 선택만 바꾸면 녹음을 삭제하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 500
                voiceMode:
                  type: string
                  nullable: true
                  enum: [TTS, FAMILY, null]
      responses:
        '200':
          description: 실제 저장된 대상 안내
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guidance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/patterns/{patternId}/guidance/{target}/audio:
    parameters:
      - $ref: '#/components/parameters/PatternId'
      - $ref: '#/components/parameters/GuidanceTarget'
    post:
      tags: [Patterns]
      operationId: uploadGuidanceAudio
      summary: 가족 녹음 업로드 또는 교체
      description: 10MB 이하 WebM, OGG, MP4, MP3, WAV를 허용한다. 현재 저장된 문구를 읽은 녹음을 올린다. 성공하면 불일치 표시를 해제한다. 실패하면 이전 파일과 참조를 유지한다. 음성 선택은 별도로 저장한다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 교체된 녹음 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guidance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: 10MB 초과
        '415':
          description: 지원하지 않는 파일 형식
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Patterns]
      operationId: getGuidanceAudio
      summary: 로그인 사용자 소유 안내의 녹음 재생
      responses:
        '200':
          description: 녹음의 Content-Type으로 반환하며 브라우저 캐시를 저장하지 않는다.
          content:
            audio/*:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/auth/kakao/start:
    get:
      tags: [Authentication]
      operationId: startKakaoLogin
      summary: 카카오 OAuth 인가 시작
      description: CSRF 방지 state를 서버 세션에 저장하고 카카오 동의 화면으로 이동한다.
      security: []
      responses:
        '302':
          description: 카카오 인가 화면으로 이동
          headers:
            Location:
              schema:
                type: string
                format: uri
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/kakao/callback:
    get:
      tags: [Authentication]
      operationId: handleKakaoCallback
      summary: 카카오 OAuth 콜백 처리
      description: 인가 코드를 토큰으로 교환하고 카카오 사용자와 시드 사용자를 연결한 뒤 서버 세션을 만든다.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: 성공, 취소 또는 오류 상태를 담아 프론트엔드 콜백 화면으로 이동
          headers:
            Location:
              schema:
                type: string
                format: uri
  /api/auth/session:
    get:
      tags: [Authentication]
      operationId: getSession
      summary: 현재 로그인 세션 조회
      security: []
      responses:
        '200':
          description: 인증 여부와 인증된 경우의 현재 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: 현재 서버 세션 로그아웃
      description: OAuth 토큰을 포함한 현재 HttpSession을 제거한다.
      security: []
      responses:
        '204':
          description: 세션 제거 완료 또는 이미 로그아웃 상태
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 애플리케이션 상태 확인
      security: []
      responses:
        '200':
          description: 애플리케이션이 실행 중임
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/health/db:
    get:
      tags: [Health]
      operationId: getDatabaseHealth
      summary: 데이터베이스 연결 상태 확인
      security: []
      responses:
        '200':
          description: 데이터베이스 상태 확인 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealthResponse'
  /api/accounts:
    get:
      tags: [Accounts]
      operationId: getAccounts
      summary: 본인 계좌 목록 조회
      responses:
        '200':
          description: 기본 출금 계좌가 먼저 정렬된 본인 계좌 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnedAccount'
  /api/accounts/import-options:
    get:
      tags: [Accounts]
      operationId: getMockAccountImportOptions
      summary: 본인 계좌 불러오기 선택지 조회
      responses:
        '200':
          description: 불러온 계좌와 아직 불러오지 않은 후보 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MockAccountImportOption'
  /api/accounts/{accountId}/import:
    post:
      tags: [Accounts]
      operationId: importMockAccount
      summary: 선택한 본인 계좌 불러오기
      description: 이미 불러온 계좌를 다시 요청해도 잔액과 기존 자료를 변경하지 않고 같은 결과를 반환한다.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: 불러온 본인 계좌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedAccount'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/accounts/{accountId}/balance:
    get:
      tags: [Accounts]
      operationId: getAccountBalance
      summary: 본인 계좌 잔액 조회
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: 계좌 현재 잔액
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/accounts/{accountId}/transactions:
    get:
      tags: [Accounts]
      operationId: getAccountTransactions
      summary: 본인 계좌 거래내역 조회
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: category
          in: query
          required: false
          description: 거래 카테고리 필터
          schema:
            $ref: '#/components/schemas/TransactionCategory'
      responses:
        '200':
          description: 최신순 거래내역
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/registered-persons:
    get:
      tags: [Registered People]
      operationId: getRegisteredPersons
      summary: 등록 인물과 수취 계좌 목록 조회
      responses:
        '200':
          description: 등록 인물 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegisteredPerson'
    post:
      tags: [Registered People]
      operationId: createRegisteredPerson
      summary: 등록 인물과 수취 계좌 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisteredPersonRequest'
      responses:
        '201':
          description: 생성된 등록 인물
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredPerson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/registered-persons/{registeredPersonId}:
    put:
      tags: [Registered People]
      operationId: updateRegisteredPerson
      summary: 등록 인물의 이름과 관계 수정
      parameters:
        - $ref: '#/components/parameters/RegisteredPersonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisteredPersonUpdateRequest'
      responses:
        '200':
          description: 수정된 등록 인물
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredPerson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/registered-persons/{registeredPersonId}/accounts:
    post:
      tags: [Registered People]
      operationId: addRecipientAccount
      summary: 기존 등록 인물에게 받는 계좌 추가
      parameters:
        - $ref: '#/components/parameters/RegisteredPersonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientAccountRequest'
      responses:
        '201':
          description: 계좌가 추가된 등록 인물
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredPerson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/registered-persons/{registeredPersonId}/accounts/{accountId}:
    put:
      tags: [Registered People]
      operationId: updateRecipientAccount
      summary: 기존 등록 인물의 받는 계좌 수정
      parameters:
        - $ref: '#/components/parameters/RegisteredPersonId'
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientAccountRequest'
      responses:
        '200':
          description: 계좌가 수정된 등록 인물
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredPerson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/transfers:
    post:
      tags: [Transfers]
      operationId: createMockTransfer
      summary: 등록 수취 계좌 또는 직접 입력 계좌로 Mock 송금
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: 정상 송금 완료 또는 이상거래 재확인 필요 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/anomaly-events/{anomalyEventId}/resolve:
    post:
      tags: [Transfers]
      operationId: resolveAnomaly
      summary: 이상거래 재확인 후 계속 송금 또는 취소
      description: 이미 최종 처리된 이상거래는 추가 변경 없이 저장된 최종 결과를 반환한다.
      parameters:
        - $ref: '#/components/parameters/AnomalyEventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveAnomalyRequest'
      responses:
        '200':
          description: 이상거래 최종 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveAnomalyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/support:
    get:
      tags: [Support]
      operationId: getSupport
      summary: 보호자 연락처와 고객센터 전화번호 조회
      responses:
        '200':
          description: 전화 연결에 사용할 지원 연락처
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportResponse'
  /api/tts:
    post:
      tags: [TTS]
      operationId: createSpeech
      summary: 화면 안내 문구 음성 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TtsRequest'
      responses:
        '200':
          description: MP3 형식의 음성 안내
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
