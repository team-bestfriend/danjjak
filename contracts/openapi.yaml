        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/pattern-executions/{executionId}/visits:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [Patterns]
      operationId: startPatternStepVisit
      summary: 패턴 실행의 단계 방문 시작
      description: 동일 실행과 단계의 방문번호를 1부터 증가시킨다. 이전 열린 방문은 미완료로 종료한 뒤 새 방문을 생성한다. 미동의 시 저장하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitStartRequest'
      responses:
        '201':
          description: 생성된 단계 방문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepVisit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '204':
          description: 현재 이용 기록 미동의로 저장하지 않은 성공 응답 (본문 없음)
        '409':
          $ref: '#/components/responses/Conflict'
  /api/pattern-executions/{executionId}/visits/{visitId}:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
      - $ref: '#/components/parameters/VisitId'
    patch:
      tags: [Patterns]
      operationId: updatePatternStepVisit
      summary: 단계 방문 행동 집계와 종료 저장
      description: >-
        원시 클릭 대신 현재 방문의 누적 총계를 저장한다. 증분이 아니며 기존 값보다 작은 총계는
        무시한다. RETRY는 실패 후 같은 단계에서 다시 시도한 경우, BACK은 서비스 내부 이전 단계 이동,
        WRONG_TOUCH는 안내 대상 이외의 유효한 조작 요소 선택을 뜻한다.
        routeDeviation은 한 번 true이면 false로 되돌리지 않는다.
        completed를 생략하면 행동만 수정하고, true이면 정상 완료, false이면 미완료로 방문을 종료한다.
        종료된 실행 또는 방문은 중복 완료를 포함해 409로 거부한다.
        현재 이용 기록 미동의 시 저장 없이 204를 반환한다. 원시 클릭·좌표·PIN·전체 계좌번호·
        음성 인식 문장·오디오·transcript는 요청하거나 저장하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitUpdateRequest'
      responses:
        '200':
          description: 갱신된 단계 방문과 시각에서 계산한 소요시간
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepVisit'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: 현재 이용 기록 미동의로 저장하지 않은 성공 응답 (본문 없음)
  /api/pattern-executions/{executionId}:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    patch:
      tags: [Patterns]
      operationId: finishPatternExecution
      summary: 패턴 실행 최종 상태 저장
      description: >-
        STARTED 실행만 종료한다. 동일 상태로 중복 종료해도 409를 반환한다.
        COMPLETED는 실제 금융 업무 성공 후, CANCELLED는 명시적 취소 후,
        FAILED는 복구 불가능한 업무 실패 후에만 호출한다. 재시도 가능한 검증·제공자 오류와
        이상거래 검토 중에는 STARTED를 유지한다. 열린 방문은 completed를 바꾸지 않고 종료한다.
        기존 실행 종료는 동의 철회 후에도 허용한다.
        송금 서비스는 성공·취소 시 실행을 직접 종료하므로 마지막 방문을 금융 요청 전에 닫고
        실행 종료 API를 중복 호출하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionFinishRequest'
      responses:
        '200':
          description: 종료된 패턴 실행
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionFinishResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/usage-analysis:
    get:
      tags: [Usage Analysis]
      operationId: getUsageAnalysis
      summary: 현재 사용자의 기간별 금융 패턴 이용 분석
      description: >-
        FR-048, FR-049. 세션 사용자만 조회하며 userId 입력은 받지 않는다.
        from과 to는 DB에 기록한 서버 로컬 날짜 기준이며 양 끝 날짜를 포함한다.
        기간 중 ended_at이 속하는 실행을 대상으로 상태가 COMPLETED인 횟수를 패턴별 계산한다.
        대상 실행(COMPLETED·CANCELLED·FAILED)의 모든 방문을 방문 완료 여부와 관계없이 집계하며,
        실행 시작이나 방문 시각이 기간 밖이어도 해당 실행의 방문은 포함한다.
        ended_at이 없는 STARTED 실행은 완료 횟수와 단계 분석 모두에서 제외한다.
        비활성화 패턴의 기록도 포함하고 실행이 없는 패턴은 배열에 포함하지 않는다.
        단계별 retryCount, backCount, wrongTouchCount, routeDeviationCount는 모든 방문의 행동별 합계다.
        errorScore는 기존과 같이 retryCount + backCount + wrongTouchCount + routeDeviationCount 합계다.
        평균 소요시간은 ended_at이 있는 방문만 사용하며
        종료 방문이 없으면 null이다. 현재 시간으로 미종료 방문의 시간을 추정하지 않는다.
        difficultStep은 errorScore 내림차순, 평균 소요시간 내림차순(null은 마지막),
        stepOrder 오름차순, 모두 같으면 stepId 오름차순으로 결정한다.
        방문이 없으면 difficultStep은 null이며 점수 0인 실제 방문은 선택 대상이다.
        동의 미완료·거부 및 기록 없음은 오류가 아닌 200 응답이다. 결과를 영구 저장하지 않는다.
      parameters:
        - name: from
          in: query
          required: true
          description: 시작일 (1000-01-01 이상, to 이하)
          schema:
            type: string
            format: date
          example: '2026-09-01'
        - name: to
          in: query
          required: true
          description: 종료일 (9999-12-31 이하, 해당 날짜 전체 포함)
          schema:
            type: string
            format: date
          example: '2026-09-30'
      responses:
        '200':
          description: 동의·빈 상태 또는 계산된 이용 분석
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageAnalysisResponse'
        '400':
          description: 날짜 누락·형식 오류(INVALID_REQUEST) 또는 역전·범위 오류(INVALID_ANALYSIS_PERIOD)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: DANJJAKSESSION
  parameters:
    GuidanceTarget:
      name: target
      in: path
      required: true
      description: 시작 안내는 start, 실제 단계는 서버 템플릿의 stepCode
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RegisteredPersonId:
      name: registeredPersonId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AnomalyEventId:
      name: anomalyEventId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PatternId:
      name: patternId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    VisitId:
      name: visitId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 현재 데이터 상태와 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 로그인 세션이 없거나 만료됨
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 필요한 선택 동의가 없어 요청이 허용되지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: 외부 연동을 위한 로컬 설정이 준비되지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: 요청은 유효하지만 처리할 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TtsProviderError:
      description: 외부 TTS 공급자 호출 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 500
          description: 원하는 업무. 공백만 있는 문장은 허용하지 않으며 비밀번호와 계좌번호는 입력하지 않는다.
    ChatResponse:
      type: object
      required: [message, action, patternId, retryable, showRecommendations]
      properties:
        message:
          type: string
          description: 쉽고 짧은 한국어 안내. 금융 상담과 실제 조회 결과는 포함하지 않는다.
        action:
          type: string
